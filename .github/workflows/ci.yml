name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  BUILD_TYPE: Release

jobs:
  linux:
    name: Linux (VST3, tests, pluginval)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev libgtk-3-dev
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DMULTITAILS_BUILD_TESTS=ON -DMULTITAILS_COPY_AFTER_BUILD=OFF
      - name: Build
        run: cmake --build build --parallel 2
      - name: Unit tests
        run: |
          T=$(find build/Tests -name MultitailsTests -type f -perm -u+x | head -1)
          "$T"
          "$T" --snap editor-linux.png
      - name: pluginval (strictness 8)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip
          set +e
          ./pluginval --strictness-level 8 --skip-gui-tests --validate-in-process --timeout-ms 900000 \
            "build/Multitails_artefacts/$BUILD_TYPE/VST3/MULTITAILS.vst3" 2>&1 | tee pluginval.log
          rc=${PIPESTATUS[0]}
          set -e
          # On Linux pluginval sometimes (about 1 run in 40, any plugin version) segfaults while closing,
          # after every test passed: the crash is in its own VST3 host run loop (juce::RunLoop::Impl fd
          # callback), not in the plugin. Accept that one case, fail on everything else.
          if [ "$rc" -eq 139 ] && tail -n 5 pluginval.log | grep -qx 'SUCCESS'; then
            echo "::warning::pluginval passed every test, then crashed while closing (host run-loop race on Linux)"
            exit 0
          fi
          exit "$rc"
      - name: Package
        run: |
          mkdir -p dist
          cd "build/Multitails_artefacts/$BUILD_TYPE/VST3" && zip -qr "$GITHUB_WORKSPACE/dist/Multitails-${GITHUB_REF_NAME//\//-}-Linux-VST3.zip" "MULTITAILS.vst3"
      - uses: actions/upload-artifact@v4
        with:
          name: Multitails-Linux
          path: dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: editor-screenshot
          path: editor-linux.png

  macos:
    name: macOS (universal VST3 / AU / AAX, auval)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DMULTITAILS_BUILD_AAX=ON -DMULTITAILS_BUILD_TESTS=ON -DMULTITAILS_AAX_COPY_DIR="$PWD/build/aax-installed"
      - name: Build
        run: cmake --build build --config $BUILD_TYPE --parallel 3 -- -quiet
      - name: Unit tests
        run: |
          T=$(find build/Tests -path "*$BUILD_TYPE*" -name MultitailsTests -type f -perm -u+x | head -1)
          "$T"
      - name: Ad-hoc sign bundles
        run: |
          for b in build/Multitails_artefacts/$BUILD_TYPE/VST3/*.vst3 build/Multitails_artefacts/$BUILD_TYPE/AU/*.component \
                   ~/Library/Audio/Plug-Ins/VST3/"MULTITAILS.vst3" ~/Library/Audio/Plug-Ins/Components/"MULTITAILS.component"; do
            codesign --force --deep --sign - "$b"
            codesign --verify --deep --strict --verbose=2 "$b"
          done
      - name: Check minimum macOS version
        run: |
          # the plugins must not depend on the macOS of the build machine
          for b in build/Multitails_artefacts/$BUILD_TYPE/VST3/*.vst3 build/Multitails_artefacts/$BUILD_TYPE/AU/*.component; do
            bin="$b/Contents/MacOS/MULTITAILS"
            vtool -show-build "$bin"
            # Intel: 10.13 (below 10.14 the linker writes LC_VERSION_MIN_MACOSX instead of LC_BUILD_VERSION)
            x86=$(vtool -arch x86_64 -show-build "$bin" | awk '/LC_VERSION_MIN_MACOSX/{m=1} m && $1=="version"{print $2; exit} $1=="minos"{print $2; exit}')
            # Apple Silicon starts at macOS 11 whatever the target
            arm=$(vtool -arch arm64 -show-build "$bin" | awk '$1=="minos"{print $2; exit}')
            echo "x86_64 minimum: $x86, arm64 minimum: $arm"
            [ "$x86" = "10.13" ] && [ "$arm" = "11.0" ] || exit 1
          done
      - name: auval
        run: |
          killall -9 AudioComponentRegistrar || true
          auval -v aumf Mtls Gsof
      - name: pluginval (strictness 8)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --skip-gui-tests --validate-in-process --timeout-ms 900000 \
            ~/Library/Audio/Plug-Ins/VST3/"MULTITAILS.vst3"
      - name: Package
        run: |
          mkdir -p dist
          A=build/Multitails_artefacts/$BUILD_TYPE
          TAG="${GITHUB_REF_NAME//\//-}"
          ditto -c -k --keepParent "$A/VST3/MULTITAILS.vst3" "dist/Multitails-$TAG-macOS-VST3.zip"
          ditto -c -k --keepParent "$A/AU/MULTITAILS.component" "dist/Multitails-$TAG-macOS-AU.zip"
          if [ -d "$A/AAX/MULTITAILS.aaxplugin" ]; then
            ditto -c -k --keepParent "$A/AAX/MULTITAILS.aaxplugin" "dist/Multitails-$TAG-macOS-AAX-unsigned.zip"
          fi
          # installer: one approval for the package, and what it installs carries no quarantine
          mkdir -p pkgroot/Library/Audio/Plug-Ins/VST3 pkgroot/Library/Audio/Plug-Ins/Components
          ditto "$A/VST3/MULTITAILS.vst3" "pkgroot/Library/Audio/Plug-Ins/VST3/MULTITAILS.vst3"
          ditto "$A/AU/MULTITAILS.component" "pkgroot/Library/Audio/Plug-Ins/Components/MULTITAILS.component"
          VERSION=$(sed -n 's/^project(Multitails VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          pkgbuild --root pkgroot --component-plist scripts/pkg-components.plist --identifier com.gianlucasofia.multitails.pkg \
            --version "$VERSION" --install-location / "dist/Multitails-$TAG-macOS-Installer.pkg"
      - name: Test the installer
        run: |
          sudo installer -pkg dist/*.pkg -target /
          for b in /Library/Audio/Plug-Ins/VST3/"MULTITAILS.vst3" /Library/Audio/Plug-Ins/Components/"MULTITAILS.component"; do
            test -f "$b/Contents/MacOS/MULTITAILS"
            codesign --verify --deep --strict --verbose=2 "$b"
            if xattr -r "$b" | grep -q com.apple.quarantine; then exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Multitails-macOS
          path: |
            dist/*.zip
            dist/*.pkg

  windows:
    name: Windows (VST3, pluginval)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64 -DMULTITAILS_BUILD_TESTS=ON -DMULTITAILS_COPY_AFTER_BUILD=OFF
      - name: Build
        run: cmake --build build --config $env:BUILD_TYPE --parallel 3
      - name: Unit tests
        shell: bash
        run: |
          T=$(find build/Tests -name MultitailsTests.exe -type f | head -1)
          "$T"
      - name: pluginval (strictness 8)
        shell: bash
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          unzip -q pluginval.zip
          ./pluginval.exe --strictness-level 8 --skip-gui-tests --validate-in-process --timeout-ms 900000 \
            "build/Multitails_artefacts/$BUILD_TYPE/VST3/MULTITAILS.vst3"
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          TAG="${GITHUB_REF_NAME//\//-}"
          cd "build/Multitails_artefacts/$BUILD_TYPE/VST3"
          7z a -tzip "$GITHUB_WORKSPACE/dist/Multitails-$TAG-Windows-VST3.zip" "MULTITAILS.vst3" > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: Multitails-Windows
          path: dist/*.zip

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: Multitails-*
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[?"v {f=1; next} /^## /{if(f) exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "MULTITAILS $GITHUB_REF_NAME" > notes.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # release already created from the GitHub web page: just attach the builds
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "MULTITAILS $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi
